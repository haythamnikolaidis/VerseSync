[project]
name = "versesync"
version = "0.1.0"
description = "Automatic scripture-reference detection and timing for Premiere Pro"
requires-python = ">=3.11,<3.14"
dependencies = ["jellyfish>=1.0", "PyYAML>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
# The real transcription backend (T-07.2). The upstream engine is pinned to the commit on
# upstream main (54ede6a) that made the repo pip-installable (adds pyproject.toml, packaging
# only core/); faster-whisper is the version the T-02 spike and the upstream installer both use.
# av is pinned to the spike's version: faster-whisper 1.2.1 passes av.open(metadata_errors=...),
# which PyAV 19 rejects. psutil is imported by the upstream core.models.loader but not declared
# by its package (T-07.H).
transcribe = [
  "faster-whisper==1.2.1",
  "av==12.3.0",
  "psutil>=5.9",
  "faster-whisper-transcriber @ git+https://github.com/haythamnikolaidis/Faster-Whisper-Transcriber.git@54ede6af030f449f240a47f6328ef5b1b0680b6b",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["sidecar"]

[tool.setuptools.package-data]
# Every non-Python file the sidecar reads at runtime. tests/test_packaging.py fails if one is missed.
versesync = ["data/*.json", "bible/data/*.json.gz", "detect/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: NFR-2 budget tests that run in the container (cheap, run by default)"]

[tool.ruff]
src = ["sidecar"]
line-length = 100
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["sidecar"]
python_version = "3.11"
ignore_missing_imports = true
