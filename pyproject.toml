[project]
name = "versesync"
version = "0.1.0"
description = "Automatic scripture-reference detection and timing for Premiere Pro"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.18"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["sidecar"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["sidecar"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
files = ["sidecar"]
python_version = "3.11"
ignore_missing_imports = true
