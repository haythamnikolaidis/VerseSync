<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerseSync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="vs-panel">
    <header class="vs-header">
      <h1>VerseSync</h1>
      <button class="vs-btn" id="btn-ping" title="Call VS.ping on the host">Test connection</button>
    </header>

    <div class="vs-status" id="status-line" role="status" aria-live="polite">Starting…</div>
    <pre id="diag-output" class="vs-diag" hidden></pre>
    <div class="vs-status" id="sidecar-status" role="status" aria-live="polite"></div>
  </div>

  <!-- host-stub.js must precede CSInterface.js: CSInterface.js defines a global of its own, so
       the stub decides whether it is inside Premiere by the presence of __adobe_cep__ instead. -->
  <script src="js/lib/host-stub.js"></script>
  <script src="js/lib/CSInterface.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/sidecar.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
