<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerseSync</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="vf-panel">

    <header class="vf-header">
      <h1>VerseSync</h1>
      <div id="status" class="vf-status" aria-live="polite"></div>
    </header>

    <section id="setup" class="vf-section" aria-label="Setup">
      <div class="vf-label">Media</div>
      <div class="vf-file-row">
        <button id="setup-media-btn" class="vf-btn" type="button">Choose media…</button>
        <span id="setup-media-name" class="vf-filename">No file selected</span>
      </div>
      <div class="vf-label">Template</div>
      <div class="vf-file-row">
        <button id="setup-template-btn" class="vf-btn" type="button">Choose template…</button>
        <span id="setup-template-name" class="vf-filename">No template selected</span>
      </div>
      <div id="setup-template-msg" role="status" hidden></div>
      <div class="vf-mapping-row">
        <label class="vf-label" for="setup-reference">Reference</label>
        <select id="setup-reference" class="vf-select" disabled></select>
      </div>
      <div class="vf-mapping-row">
        <label class="vf-label" for="setup-body">Scripture</label>
        <select id="setup-body" class="vf-select" disabled></select>
      </div>
      <div class="vf-mapping-row">
        <label class="vf-label" for="setup-translation">Translation</label>
        <select id="setup-translation" class="vf-select" disabled></select>
        <div id="setup-attribution" class="vf-hint"></div>
      </div>
      <div class="vf-mapping-row">
        <label class="vf-label" for="setup-track">Target track</label>
        <div class="vf-track-row">
          <select id="setup-track" class="vf-select" disabled></select>
          <button id="setup-track-refresh" class="vf-btn vf-btn--small" type="button">Refresh</button>
        </div>
      </div>
      <div class="vf-mapping-row">
        <div class="vf-label">Duration</div>
        <div class="vf-radio-row">
          <input type="radio" id="setup-duration-auto" name="setup-duration" value="auto" checked>
          <label for="setup-duration-auto">Auto</label>
          <input type="radio" id="setup-duration-fixed" name="setup-duration" value="fixed">
          <label for="setup-duration-fixed">Fixed</label>
          <input type="number" id="setup-duration-sec" class="vf-input-num" min="1" step="0.5"
                 aria-label="Fixed duration in seconds" disabled>
          <span class="vf-hint">seconds</span>
        </div>
      </div>
      <div class="vf-mapping-row">
        <label class="vf-label" for="setup-leadin">Lead-in (seconds)</label>
        <input type="number" id="setup-leadin" class="vf-input-num" min="0" max="3" step="0.1">
      </div>
      <div class="vf-mapping-row">
        <button id="setup-analyse" class="vf-btn vf-btn--accent" type="button" disabled>Analyse</button>
        <div id="setup-analyse-reason" class="vf-hint" role="status"></div>
      </div>
    </section>

    <section id="progress" class="vf-section" aria-label="Progress" hidden></section>

    <section id="review" class="vf-section" aria-label="Review" hidden></section>

    <section id="insert" class="vf-section" aria-label="Insert" hidden></section>

  </div>

  <!-- Load order matters -->
  <script src="js/lib/CSInterface.js"></script>
  <script src="js/lib/host-stub.js"></script>
  <script src="js/lib/sidecar-stub.js"></script>
  <script src="js/sidecar.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/state.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/timemap.js"></script>
  <script src="js/cues.js"></script>
  <script src="js/duration.js"></script>
  <script src="js/review.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
